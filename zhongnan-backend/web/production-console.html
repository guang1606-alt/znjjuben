<!DOCTYPE html>
<!-- v2.318 制作中管理台（独立页，不侵入主站 SPA）：查看 + 干预，仅超级管理员。
     主题跟随主站 zn_theme；复用 api.js 会话（zn_token 同源）。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>制作中管理台 · 终南集</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  body.pc { min-height: 100vh; padding: 22px clamp(14px, 3vw, 36px) 48px; max-width: 1180px; margin: 0 auto; }
  .pc-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
  .pc-head h1 { font-family: var(--serif); font-size: clamp(22px, 3vw, 28px); margin: 0; letter-spacing: .04em; }
  .pc-head .sub { color: var(--text-2); font-size: 13px; margin: 6px 0 0; }
  .pc-head-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pc-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13px; cursor: pointer; text-decoration: none;
    transition: border-color var(--motion) var(--ease-out), box-shadow var(--motion) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
  .pc-btn:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .pc-btn:active { transform: translateY(1px); }
  .pc-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pc-btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .pc-btn.danger:hover { background: var(--danger); color: #fff; }
  .pc-btn:disabled { opacity: .45; cursor: not-allowed; }
  .pc-switch { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none; }
  .pc-switch input { accent-color: var(--accent); width: 15px; height: 15px; }
  .pc-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .pc-tabs button { border: 1px solid var(--line); background: var(--panel); color: var(--text-2); border-radius: 999px;
    padding: 7px 16px; font-size: 13px; cursor: pointer; transition: all var(--motion) var(--ease-out); }
  .pc-tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pc-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .pc-chip { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13px; color: var(--text-2); }
  .pc-chip b { color: var(--text); font-size: 17px; font-family: var(--serif); margin-right: 4px; }
  .pc-chip.warn b { color: var(--gold); } .pc-chip.bad b { color: var(--danger); } .pc-chip.ok b { color: var(--ok); }
  .pc-table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .pc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .pc-table th { text-align: left; padding: 12px 14px; color: var(--text-2); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .pc-table td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .pc-table tbody tr { cursor: pointer; transition: background var(--motion-fast) var(--ease-out); }
  .pc-table tbody tr:hover { background: var(--panel-2); }
  .pc-table tbody tr:last-child td { border-bottom: none; }
  .pc-badge { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; white-space: nowrap; border: 1px solid transparent; }
  .pc-badge.s-QUEUED { color: var(--gold-deep); background: var(--gold-soft); }
  .pc-badge.s-RUNNING { color: var(--accent-strong); background: var(--accent-weak); }
  .pc-badge.s-DONE { color: var(--ok); background: rgba(63,107,77,.12); }
  .pc-badge.s-FAILED { color: var(--danger); background: rgba(139,58,44,.12); }
  .pc-badge.s-CANCELED { color: var(--text-2); background: var(--panel-2); }
  .pc-live { font-size: 12px; white-space: nowrap; }
  .pc-live .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  .pc-live.on { color: var(--ok); } .pc-live.on .dot { background: var(--ok); animation: pcPulse 1.6s infinite; }
  .pc-live.orphan { color: var(--danger); } .pc-live.orphan .dot { background: var(--danger); }
  @keyframes pcPulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .pc-title-cell b { display: block; }
  .pc-title-cell small { color: var(--text-2); }
  .pc-empty { padding: 42px 0; text-align: center; color: var(--text-2); font-size: 14px; }
  .pc-guard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 42px 24px; text-align: center; margin-top: 8vh; }
  .pc-guard h2 { font-family: var(--serif); margin: 0 0 8px; }
  .pc-guard p { color: var(--text-2); margin: 0 0 18px; font-size: 14px; }
  /* 抽屉 */
  #mask { position: fixed; inset: 0; background: rgba(10, 14, 13, .42); opacity: 0; pointer-events: none; transition: opacity var(--motion) var(--ease-out); z-index: 40; }
  #mask.open { opacity: 1; pointer-events: auto; }
  #drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(480px, 100vw); background: var(--panel); border-left: 1px solid var(--line);
    box-shadow: var(--shadow-lg); transform: translateX(102%); transition: transform var(--motion-slow) var(--ease-out); z-index: 50;
    display: flex; flex-direction: column; }
  #drawer.open { transform: translateX(0); }
  .pc-drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .pc-drawer-head h3 { font-family: var(--serif); margin: 0; font-size: 17px; }
  .pc-drawer-body { overflow-y: auto; padding: 16px 20px 28px; flex: 1; }
  .pc-kv { display: grid; grid-template-columns: 88px 1fr; gap: 7px 12px; font-size: 13px; margin-bottom: 18px; }
  .pc-kv dt { color: var(--text-2); } .pc-kv dd { margin: 0; word-break: break-all; }
  .pc-sec { font-size: 13px; color: var(--text-2); margin: 20px 0 8px; letter-spacing: .08em; }
  .pc-actions { display: flex; gap: 10px; flex-wrap: wrap; padding: 12px; border: 1px dashed var(--line); border-radius: var(--radius-sm); margin-bottom: 6px; }
  .pc-hint { font-size: 12px; color: var(--text-2); margin: 8px 0 0; }
  .pc-log { width: 100%; border-collapse: collapse; font-size: 12px; }
  .pc-log th { text-align: left; color: var(--text-2); font-weight: 500; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .pc-log td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .pc-toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--accent-strong); color: #fff;
    border-radius: 999px; padding: 10px 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: all var(--motion) var(--ease-out); z-index: 60; max-width: 80vw; }
  .pc-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .pc-toast.err { background: var(--danger); }
  /* 确认模态 */
  #confirm { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 70; }
  #confirm.open { display: flex; }
  #confirm .box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg);
    width: min(400px, 90vw); padding: 22px; }
  #confirm h4 { font-family: var(--serif); margin: 0 0 10px; font-size: 16px; }
  #confirm p { color: var(--text-2); font-size: 13px; line-height: 1.7; margin: 0 0 18px; }
  #confirm .row { display: flex; gap: 10px; justify-content: flex-end; }
  @media (max-width: 640px) { .pc-kv { grid-template-columns: 76px 1fr; } .pc-hide-sm { display: none; } }
</style>
</head>
<body class="pc">
  <header class="pc-head">
    <div>
      <h1>制作中管理台</h1>
      <p class="sub">剧本生成任务 · 统一查看与干预（仅超级管理员）· 干预即退款闭环</p>
    </div>
    <div class="pc-head-actions">
      <label class="pc-switch"><input type="checkbox" id="autoRefresh" checked /><span>自动刷新</span></label>
      <button class="pc-btn" id="refreshBtn">刷新</button>
      <a class="pc-btn" href="/index.html">返回主站</a>
    </div>
  </header>

  <div id="guard" class="pc-guard hidden"></div>

  <main id="main" class="hidden">
    <nav class="pc-tabs" id="scopeTabs" aria-label="任务范围">
      <button data-scope="active" class="on">进行中</button>
      <button data-scope="failed">失败 / 取消</button>
      <button data-scope="all">全部</button>
    </nav>
    <div class="pc-summary" id="summary"></div>
    <div class="pc-table-wrap">
      <table class="pc-table">
        <thead><tr>
          <th>状态</th><th>项目 / 任务</th><th>档位</th><th>积分</th>
          <th class="pc-hide-sm">发起时间</th><th>时长</th><th>执行句柄</th><th></th>
        </tr></thead>
        <tbody id="taskBody"></tbody>
      </table>
      <div class="pc-empty hidden" id="empty">当前范围暂无任务</div>
    </div>
    <p class="pc-hint">说明：管线为流式内联执行，进度以详情中的「岗位调用时间线」呈现；无暂停/恢复；重跑请回主站项目页重新发起。「孤儿」= 服务重启后悬挂、已无活跃执行句柄的任务。</p>
  </main>

  <div id="mask"></div>
  <aside id="drawer" aria-label="任务详情">
    <div class="pc-drawer-head"><h3 id="drawerTitle">任务详情</h3><button class="pc-btn" id="drawerClose">关闭</button></div>
    <div class="pc-drawer-body" id="drawerBody"></div>
  </aside>

  <div id="confirm">
    <div class="box">
      <h4 id="cfTitle"></h4>
      <p id="cfBody"></p>
      <div class="row">
        <button class="pc-btn" id="cfCancel">再想想</button>
        <button class="pc-btn danger" id="cfOk"></button>
      </div>
    </div>
  </div>

  <div class="pc-toast" id="toast"></div>

  <script>
    // 主题跟随主站（zn_theme: tech=默认/light/dark/eye/auto）
    (function () {
      try {
        var t = localStorage.getItem('zn_theme') || 'tech';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t !== 'tech') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script src="/api.js"></script>
  <script src="/production-console.js"></script>
</body>
</html>
