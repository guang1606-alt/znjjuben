name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: typecheck + build + test (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhongnan-backend
    env:
      NODE_ENV: test
      # prisma generate 仅解析 schema 中 env("DATABASE_URL")，不连库；测试全部走 memory-prisma mock
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zhongnan-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        # 本地 npm install 隐式生成过；CI 全新沙盒必须显式跑

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build (dist/)
        run: npm run build
        # 关键：测试文件直接 require('../dist/...') 编译产物，
        # 而 dist/ 被 .gitignore 排除，全新检出必须现场构建

      - name: Run full test suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: zhongnan-backend/test-output.txt
          if-no-files-found: ignore
