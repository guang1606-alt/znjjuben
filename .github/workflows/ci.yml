name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: typecheck + test (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhongnan-backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zhongnan-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Environment diagnostics
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "os:   $(uname -a)"
          echo "arch: $(uname -m)"
          echo "cwd:  $(pwd)"
          echo "files (top 30):"
          ls -la | head -30
          echo "env (filtered):"
          env | grep -iE 'node|db|env|path|home|tmp|ci|github' | sort

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run full test suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: zhongnan-backend/test-output.txt
          if-no-files-found: ignore
