name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: typecheck + test (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhongnan-backend
    env:
      NODE_ENV: test
      # prisma generate 仅解析 schema.env("DATABASE_URL")，不连库；memory-prisma.cjs mock 覆盖全部测试
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zhongnan-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        # 本地 npm install 隐式生成过；CI 全新沙盒必须显式跑

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run full test suite
        run: npm test
        # node scripts/run-tests.cjs → 6073 用例，全绿才能 merge
